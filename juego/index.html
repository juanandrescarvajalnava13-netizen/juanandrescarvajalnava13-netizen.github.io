<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Radar Run</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --neon-cyan:#00ffff;
    --neon-orange:#ff6600;
    --neon-magenta:#ff0055;
    --neon-gold:#ffd700;
    --bg-deep:#0a0e2e;
    color-scheme: dark;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{
    margin:0; padding:0; width:100%; height:100%;
    background:var(--bg-deep);
    overflow:hidden;
    font-family:'Rajdhani', 'Segoe UI', Arial, sans-serif;
    touch-action:none;
    user-select:none;
  }
  #gameContainer{ position:fixed; inset:0; }
  #gameContainer canvas{ display:block; width:100%; height:100%; }

  .hud{
    position:absolute; top:0; left:0; right:0;
    display:flex; justify-content:space-between; align-items:flex-start;
    padding:18px 22px;
    z-index:5;
    pointer-events:none;
    opacity:0;
    transition:opacity .3s ease;
  }
  .hud.show{ opacity:1; }
  .hud-box{
    background:rgba(10,14,46,.6);
    border:1px solid rgba(0,255,255,.35);
    box-shadow:0 0 14px rgba(0,255,255,.25), inset 0 0 14px rgba(0,255,255,.08);
    border-radius:10px;
    padding:8px 16px;
    color:#eafcff;
  }
  .hud-box .lbl{
    font-size:10.5px; letter-spacing:1.5px; font-weight:700;
    color:var(--neon-cyan); text-transform:uppercase; opacity:.85;
  }
  .hud-box .val{
    font-family:'Orbitron', sans-serif;
    font-size:22px; font-weight:800;
    text-shadow:0 0 8px rgba(0,255,255,.7);
    font-variant-numeric: tabular-nums;
  }
  .hud-box.coins .val{ color:var(--neon-gold); text-shadow:0 0 10px rgba(255,215,0,.85); }
  .hud-box.score .val{ color:#fff; }

  .overlay{
    position:absolute; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:
      radial-gradient(ellipse at 50% 30%, rgba(60,20,110,.55), rgba(10,14,46,.92) 70%);
    z-index:20;
    text-align:center;
    padding:28px;
    gap:16px;
  }
  .hidden{ display:none !important; }

  .game-title{
    font-family:'Orbitron', sans-serif;
    font-size:54px; font-weight:900;
    letter-spacing:4px;
    color:#fff;
    line-height:1.1;
    margin:0;
  }
  .game-title .r1{ color:var(--neon-orange); text-shadow:0 0 18px rgba(255,102,0,.9), 0 0 40px rgba(255,102,0,.5); }
  .game-title .r2{ color:var(--neon-cyan); text-shadow:0 0 18px rgba(0,255,255,.9), 0 0 40px rgba(0,255,255,.5); }

  .crash-title{
    font-family:'Orbitron', sans-serif;
    font-size:46px; font-weight:900;
    letter-spacing:3px;
    color:var(--neon-magenta);
    text-shadow:0 0 20px rgba(255,0,85,.9), 0 0 50px rgba(255,0,85,.5);
    margin:0;
  }

  .instructions{
    display:flex; gap:14px; flex-wrap:wrap; justify-content:center;
    max-width:380px;
    margin-top:4px;
  }
  .key-row{
    display:flex; flex-direction:column; align-items:center; gap:6px;
    color:#cdeaff; font-size:12px; font-weight:600;
  }
  .key{
    width:38px; height:38px; border-radius:8px;
    background:rgba(0,255,255,.08);
    border:1px solid rgba(0,255,255,.5);
    box-shadow:0 0 10px rgba(0,255,255,.3);
    display:flex; align-items:center; justify-content:center;
    font-family:'Orbitron',sans-serif; font-weight:700; font-size:14px;
    color:var(--neon-cyan);
  }

  .btn{
    font-family:'Orbitron', sans-serif;
    border:none; cursor:pointer;
    font-weight:800;
    font-size:18px;
    letter-spacing:2px;
    color:#071018;
    padding:16px 42px;
    border-radius:10px;
    background:linear-gradient(90deg,var(--neon-cyan),#66ffe0);
    box-shadow:0 0 22px rgba(0,255,255,.7), 0 8px 20px rgba(0,0,0,.4);
    transition:transform .12s ease;
  }
  .btn:active{ transform:scale(.94); }
  .btn.retry{
    background:linear-gradient(90deg,var(--neon-orange),#ffcc33);
    box-shadow:0 0 22px rgba(255,102,0,.7), 0 8px 20px rgba(0,0,0,.4);
  }
  .btn.ad{
    background:linear-gradient(90deg,#00ff99,#00cc88);
    box-shadow:0 0 22px rgba(0,255,153,.6), 0 8px 20px rgba(0,0,0,.4);
  }
  .ads-left{
    color:#9db8d9; font-size:12px; letter-spacing:.5px; margin-top:-4px;
  }

  .ad-countdown{
    position:absolute; inset:0;
    background:#05060a;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    z-index:30;
    color:#fff;
    gap:16px;
  }
  .ad-countdown .ring{
    width:84px; height:84px;
    border-radius:50%;
    border:5px solid rgba(255,255,255,.15);
    border-top-color:#00ff99;
    animation:spin 1s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .ad-countdown .lbl{
    font-family:'Orbitron', sans-serif;
    font-weight:700; font-size:14px; opacity:.85; letter-spacing:.5px;
  }
  .ad-countdown .brand{
    font-size:11px; opacity:.4; letter-spacing:2px; text-transform:uppercase;
    position:absolute; bottom:24px;
  }

  .score-final{
    display:flex; gap:28px; margin:2px 0 6px;
  }
  .score-final .box{ display:flex; flex-direction:column; align-items:center; color:#fff; }
  .score-final .box b{
    font-family:'Orbitron',sans-serif; font-size:30px; font-weight:800;
    text-shadow:0 0 10px rgba(255,255,255,.4);
  }
  .score-final .box small{ font-size:11px; letter-spacing:1.5px; opacity:.65; font-weight:700; }

  .brandtag{
    position:absolute; bottom:16px; left:0; right:0; text-align:center;
    color:rgba(200,220,255,.35); font-size:11px; letter-spacing:2px; font-weight:600;
    z-index:4; pointer-events:none;
  }

  .touchZones{
    position:absolute; inset:0; z-index:4; display:flex;
  }
  .tz{ flex:1; }
</style>
</head>
<body>

<div id="gameContainer"></div>

<div class="hud" id="hud">
  <div class="hud-box score"><div class="lbl">Puntos</div><div class="val" id="scoreVal">0</div></div>
  <div class="hud-box coins"><div class="lbl">🪙 Monedas</div><div class="val" id="coinsVal">0</div></div>
</div>

<div class="touchZones" id="touchZones">
  <div class="tz" id="tzLeft"></div>
  <div class="tz" id="tzRight"></div>
</div>

<div class="overlay" id="startScreen">
  <h1 class="game-title"><span class="r1">RADAR</span> <span class="r2">RUN</span></h1>
  <div class="instructions">
    <div class="key-row"><div class="key">A</div>←</div>
    <div class="key-row"><div class="key">W</div>Saltar</div>
    <div class="key-row"><div class="key">S</div>Deslizar</div>
    <div class="key-row"><div class="key">D</div>→</div>
  </div>
  <button class="btn" id="btnPlay">▶ JUGAR</button>
  <div style="color:#9db8d9;font-size:12.5px;max-width:300px;">Esquiva los bloqueos, deslízate bajo las barras y junta monedas. Un choque y es game over.</div>
</div>

<div class="overlay hidden" id="gameOverScreen">
  <h1 class="crash-title">¡CRASH!</h1>
  <div class="score-final">
    <div class="box"><b id="finalScore">0</b><small>PUNTOS</small></div>
    <div class="box"><b id="finalCoins">0</b><small>MONEDAS</small></div>
  </div>
  <button class="btn ad" id="btnWatchAd">▶ VER ANUNCIO Y CONTINUAR</button>
  <div class="ads-left" id="adsLeftLabel">Te quedan 3 continuaciones con anuncio</div>
  <button class="btn retry" id="btnRetry">🔁 REINTENTAR</button>
</div>

<div class="ad-countdown hidden" id="adScreen">
  <div class="ring"></div>
  <div class="lbl">Cargando anuncio... (<span id="adTime">3</span>s)</div>
  <div class="brand">ANUNCIO · MONETAG</div>
</div>

<div class="brandtag">RADAR VIRAL · RADAR RUN</div>

<script>
(function(){
"use strict";

/* ============================================================
   RADAR RUN — clon estilizado low-poly/neon tipo Subway Surfers
   Three.js r128, un solo archivo, sin dependencias de assets.
   ============================================================ */

/* ---------- Constantes de diseño ---------- */
var LANES = [-2.2, 0, 2.2];
var PLAYER_Z = 0;
var SPAWN_Z = -62;          // qué tan lejos nace cada cosa nueva
var REMOVE_Z = 6;           // cuándo se elimina (ya pasó la cámara)
var BASE_SPEED = 13;        // unidades/seg
var MAX_SPEED = 30;
var SPEED_RAMP = 0.12;      // qué tan rápido sube la velocidad
var JUMP_VELOCITY = 10.5;
var GRAVITY = -26;
var SLIDE_TIME = 0.55;
var LANE_LERP = 10;

var COLORS = {
  cyan:0x00ffff, orange:0xff6600, yellow:0xffff33, magenta:0xff0055,
  gold:0xffd700, trainBlue:0x0066ff, trainGreen:0x00ff99, asphalt:0x15131f,
  deepBg:0x0a0e2e
};

/* ---------- Estado del juego ---------- */
var state = 'start'; // start | playing | over
var score = 0, coinsCollected = 0, elapsed = 0, speed = BASE_SPEED;
var currentLane = 1;
var playerY = 0, playerVY = 0, isJumping = false, isSliding = false, slideTimer = 0, invulnTimer = 0;
var obstacles = [];  // {group, collisionMesh, lane, z}
var coins = [];      // {mesh, lane, z, taken}
var coinBursts = []; // partículas al recoger monedas
var spawnTimer = 0, coinTimer = 0;
var adsUsedThisRun = 0, MAX_ADS = 3;

/* ---------- Integración con Telegram Mini App (si se abre dentro de Telegram) ---------- */
var tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
if(tg){
  try{
    tg.ready();
    tg.expand();               // ocupa toda la pantalla disponible, no solo media hoja
    tg.setHeaderColor && tg.setHeaderColor('#0a0e2e');
    tg.setBackgroundColor && tg.setBackgroundColor('#0a0e2e');
    tg.disableVerticalSwipes && tg.disableVerticalSwipes(); // evita que el swipe cierre la app por error
  }catch(e){ console.warn('Telegram WebApp init:', e); }
}

/* ---------- Three.js setup ---------- */
var container = document.getElementById('gameContainer');
var scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x160c35, 14, 72);

var camera = new THREE.PerspectiveCamera(62, window.innerWidth/window.innerHeight, 0.1, 200);
camera.position.set(0, 4.2, 8.5);
camera.lookAt(0, 1.4, -10);

var renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearColor(0x0a0e2e, 1);
container.appendChild(renderer.domElement);

window.addEventListener('resize', function(){
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

/* ---------- Cielo degradado (shader simple de 2 colores) ---------- */
(function buildSky(){
  var skyGeo = new THREE.SphereGeometry(140, 24, 16);
  var skyMat = new THREE.ShaderMaterial({
    side: THREE.BackSide,
    uniforms:{
      topColor:{ value:new THREE.Color(0x0a0e2e) },
      bottomColor:{ value:new THREE.Color(0x3a1c6e) },
      offset:{ value: 18 },
      exponent:{ value: 0.7 }
    },
    vertexShader:
      "varying vec3 vWorldPosition;\n" +
      "void main(){\n" +
      "  vec4 worldPosition = modelMatrix * vec4(position, 1.0);\n" +
      "  vWorldPosition = worldPosition.xyz;\n" +
      "  gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);\n" +
      "}",
    fragmentShader:
      "uniform vec3 topColor;\n" +
      "uniform vec3 bottomColor;\n" +
      "uniform float offset;\n" +
      "uniform float exponent;\n" +
      "varying vec3 vWorldPosition;\n" +
      "void main(){\n" +
      "  float h = normalize(vWorldPosition + vec3(0.0, offset, 0.0)).y;\n" +
      "  gl_FragColor = vec4(mix(bottomColor, topColor, max(pow(max(h, 0.0), exponent), 0.0)), 1.0);\n" +
      "}"
  });
  var sky = new THREE.Mesh(skyGeo, skyMat);
  scene.add(sky);
})();

/* ---------- Luces ---------- */
var ambient = new THREE.AmbientLight(0x7a6bb0, 0.65);
scene.add(ambient);
var dirLight = new THREE.DirectionalLight(0xfff0dd, 0.9);
dirLight.position.set(6, 12, 6);
scene.add(dirLight);
var fillLight = new THREE.PointLight(0x00ffff, 0.6, 30);
fillLight.position.set(0, 3, -4);
scene.add(fillLight);

/* ---------- Pista ---------- */
var trackGroup = new THREE.Group();
scene.add(trackGroup);

// textura de asfalto técnico (rejilla de circuito tenue) generada por canvas, sin archivos externos
function makeAsphaltTexture(){
  var cnv = document.createElement('canvas');
  cnv.width = 256; cnv.height = 512;
  var c = cnv.getContext('2d');
  c.fillStyle = '#15131f';
  c.fillRect(0,0,256,512);
  // ruido sutil
  for(var i=0;i<900;i++){
    var v = 10+Math.random()*14;
    c.fillStyle = 'rgba('+v+','+v+','+(v+6)+',0.5)';
    c.fillRect(Math.random()*256, Math.random()*512, 1.4, 1.4);
  }
  // líneas de circuito cian tenues
  c.strokeStyle = 'rgba(0,255,255,0.18)';
  c.lineWidth = 2;
  for(var y=20;y<512;y+=48){
    c.beginPath(); c.moveTo(0,y); c.lineTo(256,y); c.stroke();
  }
  c.strokeStyle = 'rgba(0,255,255,0.1)';
  for(var x=16;x<256;x+=32){
    c.beginPath(); c.moveTo(x,0); c.lineTo(x,512); c.stroke();
  }
  var tex = new THREE.CanvasTexture(cnv);
  tex.wrapS = THREE.RepeatWrapping; tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(3, 48);
  return tex;
}
var groundMat = new THREE.MeshStandardMaterial({ map: makeAsphaltTexture(), color: 0xffffff, roughness:0.92, metalness:0.08 });
var ground = new THREE.Mesh(new THREE.PlaneGeometry(9, 220), groundMat);
ground.rotation.x = -Math.PI/2;
ground.position.set(0, 0, -70);
trackGroup.add(ground);

// bordes neón cian a los lados de cada carril
function addNeonRail(x){
  var mat = new THREE.MeshBasicMaterial({ color: COLORS.cyan });
  var rail = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.05, 220), mat);
  rail.position.set(x, 0.03, -70);
  trackGroup.add(rail);
}
addNeonRail(-3.3); addNeonRail(-1.1); addNeonRail(1.1); addNeonRail(3.3);

// líneas transversales ("durmientes") que se reciclan para sensación de velocidad
var ties = [];
for(var ti=0; ti<26; ti++){
  var tieMat = new THREE.MeshBasicMaterial({ color:0x2a2750 });
  var tie = new THREE.Mesh(new THREE.BoxGeometry(7.4, 0.04, 0.22), tieMat);
  tie.position.set(0, 0.025, -(ti*3.1));
  trackGroup.add(tie);
  ties.push(tie);
}

/* ---------- Ambientación extra: postes con farol, estrellas y polvo flotante ---------- */
function makeGlowSprite(color, size){
  var cnv = document.createElement('canvas'); cnv.width = cnv.height = 64;
  var c = cnv.getContext('2d');
  var g = c.createRadialGradient(32,32,0,32,32,32);
  g.addColorStop(0, 'rgba(255,255,255,1)');
  g.addColorStop(0.35, color);
  g.addColorStop(1, 'rgba(0,0,0,0)');
  c.fillStyle = g; c.fillRect(0,0,64,64);
  var tex = new THREE.CanvasTexture(cnv);
  var mat = new THREE.SpriteMaterial({ map:tex, color:0xffffff, transparent:true, blending:THREE.AdditiveBlending, depthWrite:false });
  var spr = new THREE.Sprite(mat);
  spr.scale.set(size,size,1);
  return spr;
}

var pillars = [];
for(var pi=0; pi<10; pi++){
  var side = pi%2===0 ? -1 : 1;
  var g = new THREE.Group();
  var poleMat = new THREE.MeshStandardMaterial({ color:0x2b2650, roughness:0.6, metalness:0.3 });
  var pole = new THREE.Mesh(new THREE.CylinderGeometry(0.07,0.09,3.4,8), poleMat);
  pole.position.y = 1.7;
  g.add(pole);
  var armLen = 0.7;
  var armMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.04,0.04,armLen,6), poleMat);
  armMesh.rotation.z = Math.PI/2;
  armMesh.position.set(side*armLen*0.5, 3.3, 0);
  g.add(armMesh);
  var lampColor = (pi%3===0) ? 'rgba(0,255,255,0.9)' : 'rgba(255,160,230,0.9)';
  var glow = makeGlowSprite(lampColor, 2.4);
  glow.position.set(side*armLen, 3.3, 0);
  g.add(glow);
  var bulb = new THREE.Mesh(new THREE.SphereGeometry(0.08,8,8), new THREE.MeshBasicMaterial({ color:0xffffff }));
  bulb.position.set(side*armLen, 3.3, 0);
  g.add(bulb);
  g.position.set(side*4.6, 0, -(pi*13));
  trackGroup.add(g);
  pillars.push(g);
}

// estrellas lejanas, estáticas, encima del horizonte
(function buildStars(){
  var starCount = 260;
  var positions = new Float32Array(starCount*3);
  for(var i=0;i<starCount;i++){
    var a = Math.random()*Math.PI*2;
    var h = 0.25+Math.random()*0.7;
    var r = 90+Math.random()*40;
    positions[i*3] = Math.cos(a)*r;
    positions[i*3+1] = 20 + h*60;
    positions[i*3+2] = Math.sin(a)*r - 40;
  }
  var geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(positions,3));
  var mat = new THREE.PointsMaterial({ color:0xffffff, size:0.5, transparent:true, opacity:0.85, sizeAttenuation:true });
  var stars = new THREE.Points(geo, mat);
  scene.add(stars);
})();

// polvo/partículas de datos flotando cerca de la pista para dar atmósfera
var DUST_COUNT = 90;
var dustGeo = new THREE.BufferGeometry();
var dustPos = new Float32Array(DUST_COUNT*3);
var dustSpeed = [];
for(var di=0; di<DUST_COUNT; di++){
  dustPos[di*3] = (Math.random()-0.5)*8;
  dustPos[di*3+1] = Math.random()*3.2;
  dustPos[di*3+2] = -Math.random()*60;
  dustSpeed.push(0.25+Math.random()*0.5);
}
dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPos,3));
var dustMat = new THREE.PointsMaterial({ color:0x8fd9ff, size:0.05, transparent:true, opacity:0.55, blending:THREE.AdditiveBlending, depthWrite:false });
var dust = new THREE.Points(dustGeo, dustMat);
scene.add(dust);

/* ---------- Jugador: humanoide low-poly con articulaciones reales ---------- */
var player = new THREE.Group();
scene.add(player);

function neonMat(color, emissiveIntensity){
  return new THREE.MeshStandardMaterial({
    color:color, emissive:color, emissiveIntensity: emissiveIntensity!==undefined?emissiveIntensity:0.35,
    roughness:0.45, metalness:0.2
  });
}

var skinMat   = new THREE.MeshStandardMaterial({ color:0xffcaa0, roughness:0.7, metalness:0.05, emissive:0x2a1407, emissiveIntensity:0.18 });
var hairMat   = new THREE.MeshStandardMaterial({ color:0x2a1912, roughness:0.55 });
var hoodieMat = neonMat(COLORS.orange, 0.5);
var trimMat   = neonMat(COLORS.yellow, 0.85);
var pantsMat  = new THREE.MeshStandardMaterial({ color:0x20233a, roughness:0.7, metalness:0.1, emissive:0x0a0c1a, emissiveIntensity:0.25 });
var shoeMat   = new THREE.MeshStandardMaterial({ color:0x15151f, roughness:0.5, metalness:0.25 });
var soleMat   = neonMat(COLORS.cyan, 1.0);
var visorMat  = neonMat(COLORS.cyan, 1.0);

// grupo del torso hacia arriba: permite inclinarlo/hacerlo "respirar" al correr sin tocar las piernas
var upperBody = new THREE.Group();
upperBody.position.set(0, 0, 0);
player.add(upperBody);

// torso tipo buso/hoodie, ligeramente cónico para que no se vea como una caja
var torso = new THREE.Mesh(new THREE.CylinderGeometry(0.33, 0.41, 0.62, 10), hoodieMat);
torso.position.set(0, 0.95, 0);
upperBody.add(torso);

var chestStripe = new THREE.Mesh(new THREE.CylinderGeometry(0.345, 0.345, 0.1, 10), trimMat);
chestStripe.position.set(0, 0.95, 0);
upperBody.add(chestStripe);

var collar = new THREE.Mesh(new THREE.TorusGeometry(0.21, 0.045, 6, 12), trimMat);
collar.position.set(0, 1.27, 0);
collar.rotation.x = Math.PI/2;
upperBody.add(collar);

// cabeza: cráneo redondeado + cabello + visera deportiva (sin caja cuadrada)
var headGroup = new THREE.Group();
headGroup.position.set(0, 1.5, 0);
upperBody.add(headGroup);

var head = new THREE.Mesh(new THREE.SphereGeometry(0.24, 14, 12), skinMat);
headGroup.add(head);

var hair = new THREE.Mesh(new THREE.SphereGeometry(0.25, 14, 10, 0, Math.PI*2, 0, Math.PI*0.52), hairMat);
hair.position.y = 0.03;
headGroup.add(hair);

var visor = new THREE.Mesh(new THREE.SphereGeometry(0.205, 14, 10, 0, Math.PI*2, 0.15, Math.PI*0.38), visorMat);
visor.position.set(0, 0.015, 0);
visor.scale.set(1,0.72,1);
headGroup.add(visor);

// brazos con pivote en el hombro, para que el balanceo cuelgue natural como un brazo real
function makeArm(side){
  var pivot = new THREE.Group();
  pivot.position.set(side*0.39, 1.21, 0);
  var shoulder = new THREE.Mesh(new THREE.SphereGeometry(0.115,10,8), hoodieMat);
  pivot.add(shoulder);
  var sleeve = new THREE.Mesh(new THREE.CylinderGeometry(0.115, 0.1, 0.24, 8), hoodieMat);
  sleeve.position.y = -0.1;
  pivot.add(sleeve);
  var arm = new THREE.Mesh(new THREE.CylinderGeometry(0.095, 0.08, 0.5, 8), skinMat);
  arm.position.y = -0.47;
  pivot.add(arm);
  var hand = new THREE.Mesh(new THREE.SphereGeometry(0.09,8,8), skinMat);
  hand.position.y = -0.72;
  pivot.add(hand);
  upperBody.add(pivot);
  return pivot;
}
var armPivotL = makeArm(-1);
var armPivotR = makeArm(1);

// piernas con pivote en la cadera y zapatillas con suela neón
function makeLeg(side){
  var pivot = new THREE.Group();
  pivot.position.set(side*0.2, 0.62, 0);
  var leg = new THREE.Mesh(new THREE.CylinderGeometry(0.135, 0.1, 0.56, 8), pantsMat);
  leg.position.y = -0.28;
  pivot.add(leg);
  var shoe = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.14, 0.33), shoeMat);
  shoe.position.set(0, -0.56, 0.07);
  pivot.add(shoe);
  var sole = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.05, 0.33), soleMat);
  sole.position.set(0, -0.62, 0.07);
  pivot.add(sole);
  player.add(pivot);
  return pivot;
}
var legPivotL = makeLeg(-1);
var legPivotR = makeLeg(1);

player.position.set(LANES[currentLane], 0, PLAYER_Z);

/* ---------- Geometrías / materiales reutilizables para obstáculos y monedas ---------- */
var lowMat = neonMat(COLORS.magenta, 0.6);
var highMat = neonMat(COLORS.cyan, 0.6);
var trainBodyMat = neonMat(COLORS.trainBlue, 0.45);
var trainWinMat = new THREE.MeshStandardMaterial({ color:0xbfe9ff, emissive:0xbfe9ff, emissiveIntensity:0.9 });
var coinMat = new THREE.MeshStandardMaterial({ color:COLORS.gold, emissive:COLORS.gold, emissiveIntensity:0.75, metalness:0.6, roughness:0.3 });
var coinGeo = new THREE.TorusGeometry(0.34, 0.13, 10, 18);

function makeLowBarrier(lane){
  var g = new THREE.Group();
  var box = new THREE.Mesh(new THREE.BoxGeometry(1.7, 0.6, 0.5), lowMat);
  box.position.y = 0.3;
  g.add(box);
  // patas
  var legMat = neonMat(0x220011, 0.1);
  [-0.75, 0.75].forEach(function(dx){
    var leg = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.3, 0.1), legMat);
    leg.position.set(dx, 0.15, 0);
    g.add(leg);
  });
  g.position.set(LANES[lane], 0, SPAWN_Z);
  trackGroup.add(g);
  return { group:g, collisionMesh:box, lane:lane, kind:'low' };
}

function makeHighBarrier(lane){
  var g = new THREE.Group();
  var bar = new THREE.Mesh(new THREE.BoxGeometry(1.7, 0.45, 0.4), highMat);
  bar.position.y = 1.35;
  g.add(bar);
  var poleMat = neonMat(0x002a2a, 0.15);
  [-0.8, 0.8].forEach(function(dx){
    var pole = new THREE.Mesh(new THREE.BoxGeometry(0.1, 1.35, 0.1), poleMat);
    pole.position.set(dx, 0.675, 0);
    g.add(pole);
  });
  g.position.set(LANES[lane], 0, SPAWN_Z);
  trackGroup.add(g);
  return { group:g, collisionMesh:bar, lane:lane, kind:'high' };
}

function makeTrainSegment(lane, zOffset, isFront){
  var g = new THREE.Group();
  var body = new THREE.Mesh(new THREE.BoxGeometry(1.9, 2.15, 2.6), trainBodyMat);
  body.position.y = 1.075;
  g.add(body);
  // ventanas
  for(var w=-0.8; w<=0.8; w+=0.8){
    var win = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.5, 0.05), trainWinMat);
    win.position.set(w*0.6, 1.5, 1.31);
    g.add(win);
  }
  // franja de advertencia
  var stripeMat = neonMat(COLORS.yellow, 0.7);
  var stripe = new THREE.Mesh(new THREE.BoxGeometry(1.92, 0.22, 2.62), stripeMat);
  stripe.position.y = 0.55;
  g.add(stripe);
  if(isFront){
    var lightMat = new THREE.MeshStandardMaterial({ color:0xfff6c9, emissive:0xfff6c9, emissiveIntensity:1.2 });
    [-0.6,0.6].forEach(function(dx){
      var lamp = new THREE.Mesh(new THREE.SphereGeometry(0.12,8,8), lightMat);
      lamp.position.set(dx, 0.9, 1.33);
      g.add(lamp);
    });
    var headlight = new THREE.PointLight(0xfff6c9, 0.8, 10);
    headlight.position.set(0, 0.9, 1.5);
    g.add(headlight);
  }
  g.position.set(LANES[lane], 0, SPAWN_Z + zOffset);
  trackGroup.add(g);
  return { group:g, collisionMesh:body, lane:lane, kind:'train' };
}

function spawnObstaclePattern(){
  var pattern = Math.random();
  if(pattern < 0.5){
    var lane = Math.floor(Math.random()*3);
    var roll = Math.random();
    if(roll < 0.34) obstacles.push(makeLowBarrier(lane));
    else if(roll < 0.67) obstacles.push(makeHighBarrier(lane));
    else {
      obstacles.push(makeTrainSegment(lane, 0, true));
      obstacles.push(makeTrainSegment(lane, -3.2, false));
    }
  } else if(pattern < 0.85){
    var free = Math.floor(Math.random()*3);
    for(var l=0; l<3; l++){
      if(l===free) continue;
      var roll2 = Math.random();
      if(roll2 < 0.5) obstacles.push(makeLowBarrier(l));
      else obstacles.push(makeHighBarrier(l));
    }
  } else {
    var kindAll = Math.random()<0.5 ? 'low' : 'high';
    for(var l2=0;l2<3;l2++){
      obstacles.push(kindAll==='low' ? makeLowBarrier(l2) : makeHighBarrier(l2));
    }
  }
}

function spawnCoinRow(){
  var lane = Math.floor(Math.random()*3);
  var count = 5 + Math.floor(Math.random()*3);
  var arc = Math.random() < 0.35;
  for(var i=0;i<count;i++){
    var mesh = new THREE.Mesh(coinGeo, coinMat);
    var z = SPAWN_Z + 6 + i*1.5;
    var yBase = 1.0 + (arc ? Math.sin(i/count*Math.PI)*0.9 : 0);
    mesh.position.set(LANES[lane], yBase, z);
    mesh.rotation.x = Math.PI/2;
    trackGroup.add(mesh);
    coins.push({ mesh:mesh, lane:lane, baseY:yBase, taken:false });
  }
}

/* ---------- Reinicio de partida ---------- */
function resetGame(){
  // limpiar obstáculos y monedas existentes
  obstacles.forEach(function(o){ trackGroup.remove(o.group); });
  coins.forEach(function(c){ trackGroup.remove(c.mesh); });
  coinBursts.forEach(function(b){ scene.remove(b.sprite); });
  obstacles = []; coins = []; coinBursts = [];

  score = 0; coinsCollected = 0; elapsed = 0; speed = BASE_SPEED;
  currentLane = 1; adsUsedThisRun = 0; invulnTimer = 0;
  playerY = 0; playerVY = 0; isJumping = false; isSliding = false; slideTimer = 0;
  player.position.set(LANES[currentLane], 0, PLAYER_Z);
  player.scale.set(1,1,1);
  spawnTimer = 0.6; coinTimer = 0.3;

  document.getElementById('scoreVal').textContent = '0';
  document.getElementById('coinsVal').textContent = '0';
}
resetGame();

/* ---------- Controles ---------- */
function moveLane(dir){
  if(state!=='playing') return;
  var nl = currentLane + dir;
  if(nl<0 || nl>2) return;
  currentLane = nl;
}
function doJump(){
  if(state!=='playing') return;
  if(isSliding){ isSliding = false; slideTimer = 0; }
  if(!isJumping){ isJumping = true; playerVY = JUMP_VELOCITY; }
}
function doSlide(){
  if(state!=='playing') return;
  if(isJumping) return;
  isSliding = true; slideTimer = SLIDE_TIME;
}

var GAME_KEYS = ['a','d','w','s',' ','arrowleft','arrowright','arrowup','arrowdown'];
function handleKeyDown(e){
  var k = e.key.toLowerCase();
  if(GAME_KEYS.indexOf(k) === -1) return;
  // evita que la página se desplace con flechas/espacio en vez de mover al personaje
  e.preventDefault();
  if(k==='a' || k==='arrowleft') moveLane(-1);
  else if(k==='d' || k==='arrowright') moveLane(1);
  else if(k==='w' || k==='arrowup' || k===' ') doJump();
  else if(k==='s' || k==='arrowdown') doSlide();
}
// un solo listener (en window): si se agrega también en document, cada tecla
// se procesaría dos veces (el evento sube de document a window) y el
// personaje saltaría de carril en carril de más — por eso va solo aquí.
window.addEventListener('keydown', handleKeyDown);

// en computador, un clic en el área del juego asegura que el teclado quede
// enfocado ahí (si el foco se queda en un botón, las flechas no llegan)
container.setAttribute('tabindex', '0');
container.style.outline = 'none';
function focusGame(){ try{ window.focus(); container.focus(); }catch(e){} }
container.addEventListener('mousedown', focusGame);
window.addEventListener('load', focusGame);
document.getElementById('btnPlay').addEventListener('click', focusGame);
document.getElementById('btnRetry').addEventListener('click', focusGame);
focusGame();

// las zonas táctiles solo tienen sentido en pantallas táctiles; en computador
// se ocultan para que no interfieran visualmente ni con los clics del mouse
var isTouchDevice = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
if(!isTouchDevice){
  document.getElementById('touchZones').style.display = 'none';
}

// controles táctiles: arrastre continuo del dedo para cambiar de carril
// (no es un swipe de una sola vez: cada tramo de ~34px de arrastre horizontal
// mueve un carril, así el dedo "lleva" al personaje mientras lo deslizas)
var DRAG_LANE_THRESHOLD = 34; // px de arrastre horizontal para saltar de carril
var dragRefX = 0, dragRefY = 0, dragging = false, dragMovedVertically = false;

window.addEventListener('touchstart', function(e){
  if(state!=='playing') return;
  var t = e.changedTouches[0];
  dragRefX = t.clientX; dragRefY = t.clientY;
  dragging = true; dragMovedVertically = false;
}, {passive:true});

window.addEventListener('touchmove', function(e){
  if(state!=='playing' || !dragging) return;
  var t = e.changedTouches[0];
  var dx = t.clientX - dragRefX;
  var dy = t.clientY - dragRefY;
  // arrastre horizontal: mueve de carril y "reinicia" la referencia para poder
  // seguir arrastrando más carriles sin soltar el dedo
  if(Math.abs(dx) >= DRAG_LANE_THRESHOLD && Math.abs(dx) >= Math.abs(dy)){
    moveLane(dx > 0 ? 1 : -1);
    dragRefX = t.clientX;
    dragRefY = t.clientY;
  }
  // arrastre vertical rápido: salto o deslizada (una sola vez por gesto)
  if(!dragMovedVertically && Math.abs(dy) >= 38 && Math.abs(dy) > Math.abs(dx)){
    dragMovedVertically = true;
    if(dy < 0) doJump(); else doSlide();
    dragRefY = t.clientY;
  }
}, {passive:true});

window.addEventListener('touchend', function(){
  dragging = false;
}, {passive:true});

document.getElementById('tzLeft').addEventListener('click', function(){ moveLane(-1); });
document.getElementById('tzRight').addEventListener('click', function(){ moveLane(1); });

/* ---------- Ráfaga de partículas al recoger una moneda ---------- */
var burstSpriteTemplate = makeGlowSprite('rgba(255,215,0,0.95)', 0.5);
function spawnCoinBurst(position){
  for(var i=0;i<6;i++){
    var spr = burstSpriteTemplate.clone();
    spr.material = burstSpriteTemplate.material.clone();
    spr.position.copy(position);
    scene.add(spr);
    var ang = Math.random()*Math.PI*2;
    var vel = new THREE.Vector3(Math.cos(ang)*1.6, 1.2+Math.random()*1.2, Math.sin(ang)*1.2);
    coinBursts.push({ sprite:spr, vel:vel, life:0.45, maxLife:0.45, baseScale:0.32 });
  }
}

/* ---------- Colisiones (AABB con Box3 real de Three.js) ---------- */
var playerBox = new THREE.Box3();
var obstacleBox = new THREE.Box3();

function checkCollisions(){
  if(invulnTimer > 0) return;
  playerBox.setFromObject(player);
  for(var i=0;i<obstacles.length;i++){
    var o = obstacles[i];
    if(Math.abs(o.group.position.z - PLAYER_Z) > 3) continue; // optimización: solo cerca del jugador
    obstacleBox.setFromObject(o.collisionMesh);
    if(playerBox.intersectsBox(obstacleBox)){
      triggerGameOver();
      return;
    }
  }
  for(var j=0;j<coins.length;j++){
    var c = coins[j];
    if(c.taken) continue;
    if(Math.abs(c.mesh.position.z - PLAYER_Z) > 1.1) continue;
    if(c.mesh.position.x !== LANES[c.lane]) continue;
    if(c.lane !== currentLane) continue;
    c.taken = true;
    coinsCollected++;
    score += 50;
    spawnCoinBurst(c.mesh.position);
    trackGroup.remove(c.mesh);
  }
}

function triggerGameOver(){
  state = 'over';
  document.getElementById('finalScore').textContent = Math.floor(score);
  document.getElementById('finalCoins').textContent = coinsCollected;
  var left = MAX_ADS - adsUsedThisRun;
  var adBtn = document.getElementById('btnWatchAd');
  var label = document.getElementById('adsLeftLabel');
  if(left>0){
    adBtn.classList.remove('hidden');
    label.textContent = 'Te quedan '+left+' continuacion'+(left===1?'':'es')+' con anuncio';
  } else {
    adBtn.classList.add('hidden');
    label.textContent = 'Ya usaste tus 3 continuaciones en esta partida';
  }
  document.getElementById('gameOverScreen').classList.remove('hidden');
  document.getElementById('hud').classList.remove('show');
}

function runSimulatedAd(onDone){
  var adScreen = document.getElementById('adScreen');
  adScreen.classList.remove('hidden');
  var t = 3;
  var timeEl = document.getElementById('adTime');
  timeEl.textContent = t;
  var iv = setInterval(function(){
    t--;
    if(t<=0){
      clearInterval(iv);
      adScreen.classList.add('hidden');
      onDone();
    } else {
      timeEl.textContent = t;
    }
  }, 1000);
  /*
    INTEGRACIÓN REAL DE MONETAG (Rewarded Interstitial):
    Sustituye este setInterval simulado por la llamada real al SDK de Monetag, por ejemplo:
      show_XXXXXXX().then(() => { onDone(); }).catch(() => { onDone(); });
    donde show_XXXXXXX es la función que genera el script de tu "Rewarded Interstitial"
    en el panel de Monetag para esta zona de anuncios.
  */
}

/* ---------- Loop principal ---------- */
var clock = new THREE.Clock();

function update(dt){
  elapsed += dt;
  speed = Math.min(MAX_SPEED, BASE_SPEED + elapsed*SPEED_RAMP*10);
  score += speed*dt*2.2;

  if(invulnTimer > 0){
    invulnTimer -= dt;
    player.visible = Math.floor(elapsed*12)%2===0;
  } else {
    player.visible = true;
  }

  // carril (tween suave)
  var targetX = LANES[currentLane];
  player.position.x += (targetX - player.position.x) * Math.min(dt*LANE_LERP, 1);

  // salto
  if(isJumping){
    playerVY += GRAVITY*dt;
    playerY += playerVY*dt;
    if(playerY <= 0){ playerY = 0; playerVY = 0; isJumping = false; }
  }
  player.position.y = playerY;

  // deslizar
  if(isSliding){
    slideTimer -= dt;
    var squash = 0.45;
    player.scale.set(1.08, squash, 1.25);
    if(slideTimer <= 0){ isSliding = false; player.scale.set(1,1,1); }
  } else if(!isJumping){
    player.scale.set(1,1,1);
  }

  // animación de correr (piernas/brazos con pivote real en hombro/cadera)
  var runCycle = elapsed * (isSliding ? 4 : 11);
  if(!isSliding){
    legPivotL.rotation.x = Math.sin(runCycle)*0.95;
    legPivotR.rotation.x = Math.sin(runCycle+Math.PI)*0.95;
    armPivotL.rotation.x = Math.sin(runCycle+Math.PI)*0.75;
    armPivotR.rotation.x = Math.sin(runCycle)*0.75;
  } else {
    legPivotL.rotation.x += (0 - legPivotL.rotation.x)*0.3;
    legPivotR.rotation.x += (0 - legPivotR.rotation.x)*0.3;
    armPivotL.rotation.x += (-0.5 - armPivotL.rotation.x)*0.3;
    armPivotR.rotation.x += (-0.5 - armPivotR.rotation.x)*0.3;
  }
  var bob = isJumping||isSliding ? 0 : Math.abs(Math.sin(runCycle))*0.07;
  upperBody.position.y = bob;
  upperBody.rotation.x = isJumping ? -0.18 : 0.06; // leve inclinación hacia adelante
  var laneVel = (LANES[currentLane] - player.position.x);
  upperBody.rotation.z += ((-laneVel*0.12) - upperBody.rotation.z)*0.15;

  // spawn
  spawnTimer -= dt;
  if(spawnTimer <= 0){
    spawnObstaclePattern();
    spawnTimer = Math.max(0.5, 1.05 - elapsed*0.01);
  }
  coinTimer -= dt;
  if(coinTimer <= 0){
    spawnCoinRow();
    coinTimer = 0.9 + Math.random()*0.7;
  }

  // mover obstáculos
  for(var i=obstacles.length-1;i>=0;i--){
    var o = obstacles[i];
    o.group.position.z += speed*dt;
    if(o.group.position.z > REMOVE_Z){
      trackGroup.remove(o.group);
      obstacles.splice(i,1);
    }
  }
  // mover monedas (con giro y flotación)
  for(var j=coins.length-1;j>=0;j--){
    var c = coins[j];
    c.mesh.position.z += speed*dt;
    c.mesh.rotation.z += dt*3.2;
    c.mesh.position.y = c.baseY + Math.sin(elapsed*5 + c.mesh.position.z*0.3)*0.08;
    if(c.mesh.position.z > REMOVE_Z || c.taken){
      trackGroup.remove(c.mesh);
      coins.splice(j,1);
    }
  }
  // reciclar durmientes de la vía (sensación de velocidad)
  for(var ti=0; ti<ties.length; ti++){
    var tie = ties[ti];
    tie.position.z += speed*dt;
    if(tie.position.z > REMOVE_Z){ tie.position.z -= ties.length*3.1; }
  }

  // reciclar postes de luz
  for(var pi2=0; pi2<pillars.length; pi2++){
    var pg = pillars[pi2];
    pg.position.z += speed*dt;
    if(pg.position.z > REMOVE_Z){ pg.position.z -= pillars.length*13; }
  }

  // flotar/reciclar el polvo ambiental
  var dustArr = dust.geometry.attributes.position.array;
  for(var di2=0; di2<DUST_COUNT; di2++){
    dustArr[di2*3+2] += speed*dt*0.7;
    dustArr[di2*3+1] += dustSpeed[di2]*dt*0.3;
    if(dustArr[di2*3+2] > REMOVE_Z){
      dustArr[di2*3+2] -= 62;
      dustArr[di2*3] = (Math.random()-0.5)*8;
      dustArr[di2*3+1] = Math.random()*0.4;
    }
  }
  dust.geometry.attributes.position.needsUpdate = true;

  // partículas de monedas (ráfaga breve al recoger)
  for(var bi=coinBursts.length-1; bi>=0; bi--){
    var b = coinBursts[bi];
    b.life -= dt;
    b.sprite.position.addScaledVector(b.vel, dt);
    b.sprite.material.opacity = Math.max(0, b.life/b.maxLife);
    b.sprite.scale.setScalar(b.baseScale * (1 + (1-b.life/b.maxLife)*1.4));
    if(b.life<=0){ scene.remove(b.sprite); coinBursts.splice(bi,1); }
  }

  checkCollisions();

  // cámara sigue al jugador suavemente
  camera.position.x += (player.position.x*0.6 - camera.position.x)*Math.min(dt*6,1);
  camera.position.y = 4.2 - (isSliding?0.3:0);
  camera.lookAt(player.position.x*0.6, 1.3, PLAYER_Z - 10);

  document.getElementById('scoreVal').textContent = Math.floor(score);
  document.getElementById('coinsVal').textContent = coinsCollected;
}

function animate(){
  var dt = Math.min(clock.getDelta(), 0.033);
  if(state==='playing'){
    try{ update(dt); }catch(err){ console.error('Radar Run frame error:', err); }
  }
  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}
requestAnimationFrame(animate);

/* ---------- Flujo de pantallas ---------- */
document.getElementById('btnPlay').addEventListener('click', function(){
  resetGame();
  document.getElementById('startScreen').classList.add('hidden');
  document.getElementById('hud').classList.add('show');
  state = 'playing';
});
document.getElementById('btnRetry').addEventListener('click', function(){
  resetGame();
  document.getElementById('gameOverScreen').classList.add('hidden');
  document.getElementById('hud').classList.add('show');
  state = 'playing';
});
document.getElementById('btnWatchAd').addEventListener('click', function(){
  if(adsUsedThisRun >= MAX_ADS) return;
  document.getElementById('gameOverScreen').classList.add('hidden');
  runSimulatedAd(function(){
    adsUsedThisRun++;
    // revive en el mismo carril, sin perder puntos ni monedas: limpiamos lo que esté muy cerca
    for(var i=obstacles.length-1;i>=0;i--){
      if(Math.abs(obstacles[i].group.position.z - PLAYER_Z) < 10){
        trackGroup.remove(obstacles[i].group);
        obstacles.splice(i,1);
      }
    }
    playerY = 0; playerVY = 0; isJumping = false; isSliding = false; slideTimer = 0;
    player.scale.set(1,1,1);
    invulnTimer = 1.8;
    document.getElementById('hud').classList.add('show');
    state = 'playing';
  });
});

})();
</script>
